[project]
name = "dronex-agents"
version = "0.1.0"
description = "DroneX Dispatch: Fetch.ai uAgents on ASI:One that turn a sentence into a verified, flying vehicle in the DroneX simulation engine."
requires-python = ">=3.10,<4.0"
dependencies = [
  "uagents>=0.26,<0.27",
  "openai>=1.50",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["dronex_agents*"]
